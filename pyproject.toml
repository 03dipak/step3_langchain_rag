[project]
name = "langchain-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "03dipak", email = "03dip.vaidya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval==2.9.3",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.12.1",
    "numpy>=2.5.2",
    "openai>=3.7.0",
    "python-dotenv>=1.2.3",
    "qwen3-embed>=1.10.0",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "typer>=0.27.2",
]

[project.scripts]
langchain-rag = "langchain_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: real ONNX/embedding + Chroma roundtrip (run with -m integration)",
]

[tool.mypy]
mypy_path = ["eval"]